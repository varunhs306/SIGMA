[project]
name = "sigma"
version = "0.1.0"
description = "Global equity analysis: deterministic metrics in Python, judgement from an LLM"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "google-api-core>=2.34.0",
    "google-genai>=1.65,<2",
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "python-telegram-bot>=22.7,<23",
    "structlog>=25.5",
    "telegramify-markdown>=1.1,<2",
    "yfinance>=1.2,<2",
]

[project.scripts]
sigma = "sigma.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigma"]
