[project]
name = "sigma"
version = "0.1.0"
description = "Global equity analysis: deterministic metrics in Python, judgement from an LLM"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
    "google-api-core>=2.34.0",
    "google-genai>=1.65,<2",
    "httpx>=0.28,<0.29",
    "numpy>=2.4,<3",
    "pandas>=3.0,<4",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "python-telegram-bot>=22.7,<23",
    "structlog>=25.5",
    "telegramify-markdown>=1.1,<2",
    "yfinance>=1.2,<2",
]

[project.scripts]
sigma = "sigma.main:main"

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0",
    "pandas-stubs>=3.0.5.260730",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sigma"]
artifacts = ["src/sigma/py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# The guard in conftest.py denies the network to every test. This marker is the
# only way past it, and --strict-markers is what stops a typo from silently
# granting the exemption to nothing.
# -m 'not network' is the default selection, so the opt-in test is opt-in by
# omission rather than by everyone remembering. A -m on the command line replaces
# this one, which is how `pytest -m network` reaches it.
addopts = "--strict-markers -m 'not network'"
markers = [
    "network: hits a real endpoint; deselected by default, run with -m network",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "S", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S607"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.12"
files = ["src/sigma", "scripts"]
plugins = ["pydantic.mypy"]
# Day 06 deferred this: strict was out of reach while the fetcher returned a bare
# dict. Killing the dict left two missing annotations, so the ratchet closes.
strict = true
warn_unreachable = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["yfinance.*", "telegramify_markdown.*", "curl_cffi.*"]
ignore_missing_imports = true
